<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flervalgsoppgaver Fysikk 2</title>

<!-- MathJax -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<link rel="stylesheet" href="../FlervalgsStyle.css">

<script src="../FlervalgScript.js" defer></script>

<style>
img {
       max-height: 400px; /* Maks høyde */
    max-width: 400px; /* Maks bredde*/    
}
</style>
</head>


<body>

<a href="../index.html">← Tilbake til hovedsiden</a>

<div class="status">
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
    <div class="teller">
        Riktig: <span id="riktig">0</span> |
        Feil: <span id="feil">0</span> |
        Score: <span id="prosent">0</span>%
    </div>
</div>







<div class="container">
    <div class="box">
        <p>En planet har masse \(M\) og radius \(R\).</p>

        <p>Et punkt P er i en avstand \(d\) over overflaten av planeten.</p>

        <p><strong>Hva er gravitasjonsfeltstyrken i P?</strong></p>

        <form id="quiz">
            <label class="svar">
                <input type="radio" name="svar" value="riktig">
                <span>\(  \gamma \frac{M}{R^2 + d^2} \)</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>\(  \gamma \frac{M}{\sqrt{R^2 + d^2}} \)</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>\(  \gamma \frac{M}{R + d} \)</span>
            </label>
                        <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>\(  \gamma \frac{M}{d} \)</span>
            </label>
                                    <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>\(  \gamma \frac{M}{d^2} \)</span>
            </label>
        </form>

        <div id="resultat"></div>
        <button id="neste" onclick="nesteSporsmal()">Neste spørsmål</button>
    </div>

   <div class="box" style="display: grid; place-items: center;">
        <img src="PlanetP.png" alt=" " >
    </div>
</div>


</body>
</html>
