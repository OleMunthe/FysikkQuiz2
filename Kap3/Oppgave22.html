<!DOCTYPE html>
<html lang="no">
<head>

img {
       max-height: 450px; /* Maks høyde */
    max-width: 450px; /* Maks bredde*/    
}

<body>

<a href="../index.html">← Tilbake til hovedsiden</a>

<div class="status">
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
    <div class="teller">
        Riktig: <span id="riktig">0</span> |
        Feil: <span id="feil">0</span> |
        Score: <span id="prosent">0</span>%
    </div>
</div>







<div class="container">
    <div class="box">
        <p>En asteroide går i en ellipsebane rundt sola. Figuren viser asteroiden ved to ulike posisjoner i
banen. Se bort fra alle andre himmellegemer enn sola og asteroiden.</p>

        <p><strong>Ved hvilken av posisjonene er den potensielle energien størst?</strong></p>

        <form id="quiz">
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>Posisjon 1</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="riktig">
                <span>Posisjon 2</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>den er like stor i posisjon 1 som i posisjon 2</span>
            </label>
        </form>

        <div id="resultat"></div>
        <button id="neste" onclick="nesteSporsmal()">Neste spørsmål</button>
    </div>

   <div class="box" style="display: grid; place-items: center;">
        <img src="ellipseastro.png" alt=" " >
    </div>
</div>


</body>
