<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flervalgsoppgaver Fysikk 2</title>

<!-- MathJax -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<link rel="stylesheet" href="../FlervalgsStyle.css">

<script src="../FlervalgScript.js" defer></script>

<style>
img {
       max-height: 250px; /* Maks høyde */
    max-width: 250px; /* Maks bredde*/    
}
</style>

<body>

<a href="../index.html">← Tilbake til hovedsiden</a>

<div class="status">
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
    <div class="teller">
        Riktig: <span id="riktig">0</span> |
        Feil: <span id="feil">0</span> |
        Score: <span id="prosent">0</span>%
    </div>
</div>







<div class="container">
    <div class="box">
        <p>En kvadratisk ledersløyfe med sidekanter 0,50 m ligger i et magnetfelt med flukstetthet 2,0 T.</p>

        <p>Flukstettheten øker til 5,0 T i løpet av 0,50 sekunder.</p>

        <p><strong>Hvor stor er spenningen som induseres?</strong></p>

        <form id="quiz">
            <label class="svar">
                <input type="radio" name="svar" value="riktig">
                <span>1,5 V</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
              <span>0,75 V</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
              <span>0,38 V</span>
            </label>
  <label class="svar">
                <input type="radio" name="svar" value="feil">
              <span>2,5 V</span>
            </label>
                        <label class="svar">
                <input type="radio" name="svar" value="feil">
              <span>5,0 V</span>
            </label>
        </form>

        <div id="resultat"></div>
        <button id="neste" onclick="nesteSporsmal()">Neste spørsmål</button>
    </div>

   <div class="box" style="display: grid; place-items: center;">
        <img src="kvadratiskKrets.png" alt=" " >
    </div>
</div>


</body>
</html>
