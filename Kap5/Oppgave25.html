<div class="status">
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
    <div class="teller">
        Riktig: <span id="riktig">0</span> |
        Feil: <span id="feil">0</span> |
        Score: <span id="prosent">0</span>%
    </div>
</div>







<div class="container">
    <div class="box">
        <p>Figuren viser en fartsvelger. Når ladningen har farten \(v\) går den rett fram.</p>

        <p><strong>Hva skjer med ladningen like etter at den kommer inn i området hvis farten er mer enn \(v\)?</strong></p>

        <form id="quiz">
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>den dyttes nedover, og farten minker</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>den dyttes nedover, og farten øker</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="riktig">
                <span>den dyttes oppover, og farten minker</span>
            </label>
             <label class="svar">
                <input type="radio" name="svar" value="feil">
               <span>den dyttes oppover, og farten øker</span>
            </label>
        </form>

        <div id="resultat"></div>
        <button id="neste" onclick="nesteSporsmal()">Neste spørsmål</button>
    </div>

   <div class="box" style="display: grid; place-items: center;">
        <img src="fartsvelgerP.png" alt=" " >
    </div>
</div>
