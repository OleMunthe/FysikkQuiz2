<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flervalgsoppgaver Fysikk 2</title>

<!-- MathJax -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<link rel="stylesheet" href="../FlervalgsStyle.css">

<script src="../FlervalgScript.js" defer></script>

<style>
img {
       max-height: 350px; /* Maks høyde */
    max-width: 350px; /* Maks bredde*/    
}
</style>
</head>


<body>

<a href="../index.html">← Tilbake til hovedsiden</a>

<div class="status">
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
    <div class="teller">
        Riktig: <span id="riktig">0</span> |
        Feil: <span id="feil">0</span> |
        Score: <span id="prosent">0</span>%
    </div>
</div>







<div class="container">
    <div class="box">
        <p>To partikler med ladning +2e og –e ligger på en rett linje.</p>

        <p><strong>Hvor på linjen er den samlede elektriske feltstyrken fra partiklene null?</strong></p>

        <form id="quiz">
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>Bare i et punkt som ligger til venstre for partiklene.</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>I et punkt som ligger mellom partiklene, og i et punkt som ligger til venstre
for partiklene.</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
               <span>I et punkt som ligger mellom partiklene, og i et punkt som ligger til høyre for
partiklene.</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="riktig">
                <span>Bare i et punkt som ligger til høyre for partiklene.</span>
            </label>
        </form>

        <div id="resultat"></div>
        <button id="neste" onclick="nesteSporsmal()">Neste spørsmål</button>
    </div>

   <div class="box" style="display: grid; place-items: center;">
        <img src="ladningerLinje.png" alt=" " >
    </div>
</div>


</body>
</html>
