<div class="status">
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
    <div class="teller">
        Riktig: <span id="riktig">0</span> |
        Feil: <span id="feil">0</span> |
        Score: <span id="prosent">0</span>%
    </div>
</div>







<div class="container">
    <div class="box">
        <p>Figuren viser tre ladde partikler plassert i hvert sitt hjørne i et kvadrat. Partiklene
er identiske bortsett fra at to har ladning +e og én har ladning –e.</p>

        <p><strong>Hvor på linjen mellom P og Q er den elektriske feltstyrken null?</strong></p>

        <form id="quiz">
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>I et punkt på linjen mellom P og O.</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>I punktet O.</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="riktig">
                <span>I et punkt på linjen mellom O og Q.</span>
            </label>
                        <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>I punktet Q.</span>
            </label>
        </form>

        <div id="resultat"></div>
        <button id="neste" onclick="nesteSporsmal()">Neste spørsmål</button>
    </div>

   <div class="box" style="display: grid; place-items: center;">
        <img src="kvadrateee.png" alt=" " >
    </div>
