<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flervalgsoppgaver Fysikk 2</title>

<!-- MathJax -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<link rel="stylesheet" href="../FlervalgsStyle.css">

<script src="../FlervalgScript.js" defer></script>

<style>
img {
       max-height: 300px; /* Maks høyde */
    max-width: 275px; /* Maks bredde*/    
}
</style>
</head>


<body>

<a href="../index.html">← Tilbake til hovedsiden</a>

<div class="status">
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
    <div class="teller">
        Riktig: <span id="riktig">0</span> |
        Feil: <span id="feil">0</span> |
        Score: <span id="prosent">0</span>%
    </div>
</div>







<div class="container">
    <div class="box">
        <p>En fjellklatrer med masse \(m\) står horisontalt inntil en fjellvegg ved hjelp av et tau. Se figur. </p>

        <p><strong>Hva er forholdet mellom normalkraften og tyngdekraften på fjellklatreren?</strong></p>

        <form id="quiz">
            <label class="svar">
                <input type="radio" name="svar" value="riktig">
                <span>\(\frac{N}{mg} = \frac{d}{D}\)</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>\(\frac{N}{mg} = \frac{D}{d}\)</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>\(\frac{N}{mg} = \frac{d}{\sqrt{D^2 + d^2}}\)</span>
            </label>
            <label class="svar">
                <input type="radio" name="svar" value="feil">
                <span>\(\frac{N}{mg} = \frac{\sqrt{D^2 + d^2}}{d}\)</span>
            </label>
        </form>

        <div id="resultat"></div>
        <button id="neste" onclick="nesteSporsmal()">Neste spørsmål</button>
    </div>

   <div class="box" style="display: grid; place-items: center;">
        <img src="Fjellklatrer.jpeg" alt=" " >
    </div>
</div>


</body>
</html>
